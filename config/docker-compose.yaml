
version: '2'
services:
  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:2.5.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /var/hyperledger/orderer
    command: orderer
    ports:
      - "7050:7050"
    volumes:
      - ../crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - ../network/genesis.block:/var/hyperledger/orderer/genesis.block
    networks:
      - herbledger
  peer0.farmer.example.com:
    container_name: peer0.farmer.example.com
    image: hyperledger/fabric-peer:2.5.5
    environment:
      - CORE_PEER_ID=peer0.farmer.example.com
      - CORE_PEER_ADDRESS=peer0.farmer.example.com:7051
      - CORE_PEER_LOCALMSPID=FarmerCollectiveMSP
      - CORE_PEER_MSPCONFIGPATH=/var/hyperledger/peer/msp
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.farmer.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.farmer.example.com:7051
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=herbledger
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/var/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/var/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCA_FILE=/var/hyperledger/peer/tls/ca.crt
    working_dir: /var/hyperledger/peer
    command: peer node start
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../crypto-config/peerOrganizations/farmer.example.com/peers/peer0.farmer.example.com/msp:/var/hyperledger/peer/msp
      - ../crypto-config/peerOrganizations/farmer.example.com/peers/peer0.farmer.example.com/tls:/var/hyperledger/peer/tls
    networks:
      - herbledger
  peer0.processor.example.com:
    container_name: peer0.processor.example.com
    image: hyperledger/fabric-peer:2.5.5
    environment:
      - CORE_PEER_ID=peer0.processor.example.com
      - CORE_PEER_ADDRESS=peer0.processor.example.com:9051
      - CORE_PEER_LOCALMSPID=ProcessorMSP
      - CORE_PEER_MSPCONFIGPATH=/var/hyperledger/peer/msp
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.processor.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.processor.example.com:9051
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=herbledger
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/var/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/var/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCA_FILE=/var/hyperledger/peer/tls/ca.crt
    working_dir: /var/hyperledger/peer
    command: peer node start
    ports:
      - "9051:9051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../crypto-config/peerOrganizations/processor.example.com/peers/peer0.processor.example.com/msp:/var/hyperledger/peer/msp
      - ../crypto-config/peerOrganizations/processor.example.com/peers/peer0.processor.example.com/tls:/var/hyperledger/peer/tls
    networks:
      - herbledger
  peer0.lab.example.com:
    container_name: peer0.lab.example.com
    image: hyperledger/fabric-peer:2.5.5
    environment:
      - CORE_PEER_ID=peer0.lab.example.com
      - CORE_PEER_ADDRESS=peer0.lab.example.com:11051
      - CORE_PEER_LOCALMSPID=LabMSP
      - CORE_PEER_MSPCONFIGPATH=/var/hyperledger/peer/msp
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.lab.example.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.lab.example.com:11051
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=herbledger
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/var/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/var/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCA_FILE=/var/hyperledger/peer/tls/ca.crt
    working_dir: /var/hyperledger/peer
    command: peer node start
    ports:
      - "11051:11051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../crypto-config/peerOrganizations/lab.example.com/peers/peer0.lab.example.com/msp:/var/hyperledger/peer/msp
      - ../crypto-config/peerOrganizations/lab.example.com/peers/peer0.lab.example.com/tls:/var/hyperledger/peer/tls
    networks:
      - herbledger
  peer0.manufacturer.example.com:
    container_name: peer0.manufacturer.example.com
    image: hyperledger/fabric-peer:2.5.5
    environment:
      - CORE_PEER_ID=peer0.manufacturer.example.com
      - CORE_PEER_ADDRESS=peer0.manufacturer.example.com:13051
      - CORE_PEER_LOCALMSPID=ManufacturerMSP
      - CORE_PEER_MSPCONFIGPATH=/var/hyperledger/peer/msp
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.manufacturer.example.com:13051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.manufacturer.example.com:13051
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=herbledger
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/var/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/var/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCA_FILE=/var/hyperledger/peer/tls/ca.crt
    working_dir: /var/hyperledger/peer
    command: peer node start
    ports:
      - "13051:13051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/manufacturer.example.com/peers/peer0.manufacturer.example.com/msp:/var/hyperledger/peer/msp
      - ./crypto-config/peerOrganizations/manufacturer.example.com/peers/peer0.manufacturer.example.com/tls:/var/hyperledger/peer/tls
    networks:
      - herbledger
networks:
  herbledger:
    driver: bridge
